services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "${API_PUBLISH_PORT}:${API_PORT}"
    env_file:
      - .env.docker
    command: ["./scripts/run_api.sh"]
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env.docker
    command: ["./scripts/run_worker.sh"]
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file:
      - .env.docker
    command: ["./scripts/run_beat.sh"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
