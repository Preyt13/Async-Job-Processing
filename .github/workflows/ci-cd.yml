name: CI and Deploy

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare env file
        # App settings for pytest come from .env.example (copied below).
        # No GitHub Secrets are required for the test job.
        run: cp .env.example .env

      - name: Run pytest
        run: pytest -q

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Main' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          missing=0
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add these under: Repo → Settings → Secrets and variables → Actions"
            echo "  DROPLET_HOST     = droplet public IP (e.g. 168.144.122.103)"
            echo "  DROPLET_USER     = root"
            echo "  DROPLET_SSH_KEY  = full private key PEM (id_ed25519), including BEGIN/END lines"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" \
            'bash -s' < infra/droplet/deploy.sh
