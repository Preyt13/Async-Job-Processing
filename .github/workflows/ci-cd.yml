name: CI and Deploy

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare env file
        # app.config requires a full .env (no in-code defaults)
        run: cp .env.example .env

      - name: Run pytest
        run: pytest -q

  deploy:
    name: Deploy to DigitalOcean App Platform
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Main' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update app spec
        run: doctl apps update "${{ secrets.DIGITALOCEAN_APP_ID }}" --spec .do/app.yaml

      - name: Create deployment
        run: >
          doctl apps create-deployment "${{ secrets.DIGITALOCEAN_APP_ID }}"
          --force-rebuild
          --wait
